# asks coolify to rebuild the website in site/ after every release, so the
# download links point at the new installers
#
# coolify deploys changes to site/ on its own, this only covers releases and
# manual runs. without the coolify secrets it does nothing, so the release
# workflow still passes

name: Site

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Redeploy site
    runs-on: ubuntu-latest
    steps:
      # a forced deploy skips the build cache, otherwise the previous release
      # would be baked in again
      - name: Trigger a deploy on Coolify
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::coolify secrets aren't set, skipping the deploy"
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "${COOLIFY_WEBHOOK/force=false/force=true}"
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
