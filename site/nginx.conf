# serves the built site, coolify's proxy sits in front and handles https

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # redirects stay relative, the proxy knows the real host and scheme
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/index.html $uri.html =404;

        # pages always check for a newer build
        add_header Cache-Control "no-cache";
    }

    # astro puts a hash in these names, so they never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
