[package]
name = "borealis"
version = "0.1.0"
description = "Lightweight multi-account WhatsApp desktop client"
authors = ["DanFQ"]
homepage = "https://getborealis.app"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "borealis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable enables child webviews for the whatsapp sessions
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

# session overlay and permissions, already pulled in by tauri
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

# download location dialog, linux uses gtk directly
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.18", default-features = false }

# native about panel, already pulled in by tauri
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSAttributedString",
  "NSColor",
  "NSFont",
  "NSParagraphStyle",
  "NSResponder",
  "NSText",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSAttributedString",
  "NSDictionary",
  "NSString",
  "NSURL",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
